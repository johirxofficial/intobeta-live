name: IntoBeta Live - Release APK
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build Debug APK (signed & installable)
        run: gradle assembleDebug --stacktrace
      - name: List APK
        run: find . -name "*.apk" -type f
      - name: Move APK
        run: |
          APK=$(find app/build/outputs -name "*.apk" | head -n 1)
          echo "FOUND: $APK"
          cp "$APK" intobeta-live-${{ github.ref_name }}-INSTALLABLE.apk
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: intobeta-live-${{ github.ref_name }}-INSTALLABLE.apk
          generate_release_notes: true
