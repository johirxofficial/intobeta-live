name: IntoBeta Live - Auto Build APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (example: v1.0.17)'
        required: true
        default: 'v1.0.17'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK" intobeta-live-${{ inputs.tag || github.ref_name }}-INSTALLABLE.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: intobeta-live-${{ inputs.tag || github.ref_name }}-INSTALLABLE.apk
          generate_release_notes: true
